# nginx site for the Balcony Station receiver (spec 5 and 8).
#
# Install as a NEW site; it touches no other site. Then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d station.carlosgorrichoai.one
# certbot adds the HTTPS server block and redirects plain HTTP to HTTPS.
# Create the dashboard login only after the certificate exists, so the
# password never travels over plain HTTP:
#   sudo htpasswd -c /etc/nginx/station.htpasswd carlos
#
# Zone names start with station_ so they can't clash with other sites.

limit_req_zone $binary_remote_addr zone=station_api:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=station_dash:1m rate=120r/m;

upstream station_receiver {
    server 127.0.0.1:8765;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name station.carlosgorrichoai.one;

    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;

    access_log /var/log/nginx/station.access.log;
    error_log /var/log/nginx/station.error.log warn;

    # Shared proxy settings. X-Forwarded-For is replaced, never appended, so a
    # client can't forge the address the receiver logs.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Node: readings upload.
    location = /api/v1/readings {
        limit_except POST { deny all; }
        limit_req zone=station_api burst=20 nodelay;
        proxy_pass http://station_receiver;
    }

    # Node: clock sync.
    location = /api/v1/time {
        limit_except GET { deny all; }
        limit_req zone=station_api burst=20 nodelay;
        proxy_pass http://station_receiver;
    }

    # Dashboard: behind the login. The app has no accounts of its own.
    location = /dashboard {
        auth_basic "Balcony Station";
        auth_basic_user_file /etc/nginx/station.htpasswd;
        limit_except GET { deny all; }
        limit_req zone=station_dash burst=60 nodelay;
        proxy_pass http://station_receiver;
    }

    location /dashboard/ {
        auth_basic "Balcony Station";
        auth_basic_user_file /etc/nginx/station.htpasswd;
        limit_except GET { deny all; }
        limit_req zone=station_dash burst=60 nodelay;
        proxy_pass http://station_receiver;
    }

    # Everything else, including /api/v1/health, /api/v1/latest and /docs,
    # is not served publicly. Check health on the VPS at 127.0.0.1:8765.
    location / {
        return 404;
    }
}
